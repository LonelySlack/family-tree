<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <!-- Served locally so the tree still loads when the internet is down. -->
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/vendor/vis-network.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">Family Tree <small class="opacity-75" id="memberCount"></small></span>
            <button class="btn btn-light ms-auto" onclick="openAddModal()">+ Add Member</button>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row g-3">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <input type="search" class="form-control form-control-sm" id="search"
                               placeholder="Search members…" oninput="renderMembersList()">
                    </div>
                    <ul class="list-group list-group-flush" id="membersList"></ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
                        <div class="legend small">
                            <span><i class="line child"></i>Child of</span>
                            <span><i class="swatch male"></i>Male</span>
                            <span><i class="swatch female"></i>Female</span>
                            <span><i class="line spouse"></i>Spouse</span>
                            <span><i class="swatch deceased"></i>Meninggal Dunia</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="small text-muted d-none d-lg-inline">Click a person for details · double-click to edit</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="fitTree()">Fit to screen</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="treeNetwork"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal fade" id="memberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger py-2 d-none" id="formError"></div>
                    <form id="memberForm" onsubmit="event.preventDefault(); saveMember();">
                        <input type="hidden" id="memberId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label">Birth Date</label>
                                <input type="date" class="form-control" id="birth_date">
                            </div>
                            <div class="col mb-3">
                                <label class="form-label">Death Date</label>
                                <input type="date" class="form-control" id="death_date" onchange="syncDeceased()">
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="is_deceased">
                                    <label class="form-check-label" for="is_deceased">Meninggal Dunia</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Father</label>
                            <select class="form-select" id="father_id"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mother</label>
                            <select class="form-select" id="mother_id"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Spouse</label>
                            <select class="form-select" id="spouse_id"></select>
                            <div class="form-text">Linked both ways: their spouse is set to this person too.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="deleteBtn" style="display:none;" onclick="deleteMember()">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveMember()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
