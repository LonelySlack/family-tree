<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Maker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Family Tree Maker</a>
            <button class="btn btn-light ms-auto" data-bs-toggle="modal" data-bs-target="#memberModal" onclick="openAddModal()">Add Member</button>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        Members List
                    </div>
                    <ul class="list-group list-group-flush" id="membersList" style="max-height: 70vh; overflow-y: auto;">
                        <!-- Members will be loaded here -->
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Family Tree Viewer (Double click a node to edit)</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="treeNetwork"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal fade" id="memberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="memberForm">
                        <input type="hidden" id="memberId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="gender">
                                <option value="">Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label class="form-label">Birth Date</label>
                                <input type="date" class="form-control" id="birth_date">
                            </div>
                            <div class="col mb-3">
                                <label class="form-label">Death Date</label>
                                <input type="date" class="form-control" id="death_date">
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="is_deceased">
                                    <label class="form-check-label" for="is_deceased">Meninggal Dunia</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Father</label>
                            <select class="form-select" id="father_id">
                                <option value="">None</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mother</label>
                            <select class="form-select" id="mother_id">
                                <option value="">None</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Spouse</label>
                            <select class="form-select" id="spouse_id">
                                <option value="">None</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="deleteBtn" style="display:none;" onclick="deleteMember()">Delete</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveMember()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
